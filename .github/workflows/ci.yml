name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + compile + import)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Không cài requirements.txt: nhiều gói chỉ chạy trên Windows (pywinauto, pywin32)
      # hoặc rất nặng (mediapipe, faster-whisper). Các bước dưới chỉ cần ruff + stdlib.
      - name: Cài ruff
        run: pip install ruff
      - name: Ruff (cấu hình trong ruff.toml)
        run: ruff check . --output-format github
      - name: Compile toàn bộ Python
        run: python -m compileall -q server.py engine hooks plugins
      - name: Kiểm tra import nội bộ
        run: python .github/scripts/check_imports.py

  tests:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      # Chỉ cài các gói mà test cần import, lấy đúng version ghi trong requirements.txt.
      # Test cần thêm gói mới → thêm tên vào danh sách grep bên dưới.
      - name: Cài dependency cho test
        run: |
          grep -E '^(openai|httpx|numpy|turbovec|rank-bm25)\b' requirements.txt > ci-requirements.txt
          pip install pytest -r ci-requirements.txt
      # tests/live gọi llama-server thật nên không chạy trên CI
      - name: pytest
        run: python -m pytest tests -q --ignore=tests/live

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: tsc + vite build
        run: npm run build
